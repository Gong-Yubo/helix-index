name: CI

# HelixIndex 持续集成
#
# 设计依据：docs/devel/v1-finish-design.md 第 5 节
#   - fmt / lint / test / deny 对应项目的阶段门槛（make all）
#   - deny 是 **NFR-09 依赖许可合规** + **依赖安全公告漂移**（拟登记 R42）的自动化守门
#     ⚠️ 2026-09-12（PR #41）起 deny 还跑 `advisories`，并 **pin 检查器版本 0.20.2**：
#        这道门有两个漂移源（RustSec 数据库 / 检查器本身），pin 掉后者后
#        「变红」只剩「新增公告」一个原因，归因成本最低
#   - doc job 用 RUSTDOCFLAGS=-D warnings 守 rustdoc 质量
#     （配合 core 的 #![deny(missing_docs)] 才是完整守门，见 V1-02）
#   - msrv job **独立安装 1.90.0**，不继承 rust-toolchain.toml——
#     否则与 test job 完全冗余；真实目的是防止有人抬高 toolchain 后
#     NFR-08 的 MSRV 声明悄悄失效
#   - features job 验证 charabia feature 隔离与 no-default-features 可编译
#
# 评测（eval-quality / eval-perf）**故意不进 CI**：
#   效果评测需 12K 段落 embed（~230s）；性能是毫秒级 P99 口径，
#   共享 runner 上的数字不具可引用性，反而会污染 eval-report.md。
#   评测脚本保持本地一键可跑即可。

on:
  push:
    branches: [main]
  # ⚠️ T7-24（issue #25 之①）：`pull_request` **刻意不加 `branches` 过滤** ——
  #    原写法 `branches: [main]` 只让 base=main 的 PR 触发 CI，**base≠main 的堆叠 PR
  #    永远跑不到 CI**（Step 2 的 #13/#14 已吃过亏，当时只能拿本地守门代替）。
  #    现在任何 PR 都会跑一遍这套门。
  #    ⚠️ 这里**刻意不**采用 issue 里并列的另一个方案「push: branches-ignore: [main]」：
  #       本仓库是 private，Actions 走**账号配额**；逐分支 push 触发会与 PR 触发**重复计费**，
  #       而「每个 PR 都有 CI」这个目标只用放开 `pull_request` 就能达成。
  pull_request:
  # 手动触发：用于不产生 PR 的场合（例如验证 workflow 配置本身改对了没）
  workflow_dispatch:

# ⚠️ T7-24（issue #25 之①）的配套：**同一 PR 连续 push 时取消被取代的旧 run**。
#    本 PR 的立论是「private 仓库、Actions 走账号配额」—— 那一维度上剩下的口子就是它：
#    旧 run 的 10 个 job（feature isolation / test 各 ~4m）会全部跑完，纯属浪费。
#    - PR 事件 ⇒ 按 PR 号分组、`cancel-in-progress: true` ⇒ 新 push 立即取消旧 run；
#    - push 事件（main）⇒ `pull_request.number` 为空、回落到 `github.ref` 分组，
#      且 `cancel-in-progress` 为 **false** ⇒ **相邻两次合并不会互相砍掉对方的 run**
#      （main 的门禁是刻意保留的，不能取消）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------ 格式
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ------------------------------------------------------------ 脚本静态检查
  # bash 3.2（macOS 自带）在多字节 locale 下不把非 ASCII 字节当作变量名终止符：
  # `"$VAR（"` 会被解析成一个变量名 ⇒ `set -u` 报 unbound variable 并中止脚本。
  # `LC_ALL=C` 下不触发 ⇒ 本地裸跑可能漏掉，须由确定性守门兜住。
  shell:
    name: shell expansion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_shell_expansion.py

  # ------------------------------------------------------------ lint
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ------------------------------------------------------------ 单测
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 注意：不跑 --ignored（那 4 个需要下载 ONNX 模型 + 万级 HNSW 构建）
      - run: cargo test --workspace

  # ------------------------------------------------------------ 许可合规（NFR-09）
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          # ⚠️ 必须 pin：检查器版本决定默认 lint / 配置字段语义 / ignore 解析行为，
          #    浮动会让「本地 make deny 绿 ⇒ CI 绿」的等价性失效。
          #    0.20.2 与 docs/devel/thirdparty.md 记录的项目工具版本一致。
          tool: cargo-deny@0.20.2
      # 2026-09-12：纳入 advisories（deny.toml 已对两条无升级路径的 `unmaintained`
      # 精确到 ID 地 ignore，每条带「核实日期 + 可判定的解除条件」）。
      # ⚠️ 这条门依赖外部 RustSec 数据库 ⇒ **数据库新增条目时 CI 会无缘无故变红**，
      #    届时重新判一次、必要时补 ignore 并在 deny.toml 记复核条件
      #    （允许在同一 PR 内做，提交信息带 `Refs #25`）。
      #    复核当前生效的 ignore 与理由：`cargo deny -L info check advisories`
      - run: cargo deny check advisories licenses bans sources

  # ------------------------------------------------------------ 文档
  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # ------------------------------------------------------------ MSRV（NFR-08）
  msrv:
    name: MSRV 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 显式装 1.90.0，**不读 rust-toolchain.toml**（否则与 test job 冗余）
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      # --all-targets：cargo check 默认不编 dev-deps/tests，
      # 不加会漏掉 criterion / proptest 等 dev 依赖的 MSRV 违规
      - run: cargo +1.90.0 check --workspace --all-targets

  # ------------------------------------------------------------ feature 隔离
  features:
    name: feature isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # charabia 是 T5-09 的验证性依赖（feature 隔离，非默认），
      # 防止分支在无人使用时悄悄腐化
      - name: charabia feature
        run: cargo test -p helix-core --features charabia
      # V2 Step 7 / S7-01：`local-rerank`（本地精排）同样是**非默认** feature ——
      # 模型合计 ≈2.19GB ⇒ 不能进默认构建 / 下载路径（设计 §3.6 / R44）。
      # 但本 crate 又必须**编译并测**它，否则重蹈 `coreml` 的腐化：
      # 只在本地用、CI 不覆盖 ⇒ 随依赖升级悄悄坏掉（见 core/Cargo.toml 的注释）。
      # ⚠️ 真模型用例一律 `#[ignore]`（`tests/step7_rerank_local.rs`）⇒ **本步不下载
      #    任何模型**。精排的**策略**（σ 变换 / 按 index 回填 / tie-break / 截断）落在
      #    不依赖 fastembed 的 `rerank::scoring`，默认 `cargo test` 就跑到（`cfg(test)`）。
      #    本步覆盖的是「`LocalReranker` 这个适配层仍然编得过、非模型的单测仍然过」。
      - name: local-rerank feature
        run: cargo test -p helix-core --features local-rerank
      # V2 Step 7 / S7-03：CLI 侧的接线（`--rerank-window` / `--rerank-max-length`
      # 的参数面 + 守卫 + 装配注入）同样只在 `local-rerank` 下才编得出来那两条
      # 分支 ⇒ 必须**同批**覆盖，否则 `cli/Cargo.toml` 的 feature 透传会悄悄腐化
      # （step 失败点会落在「只在你本地才编的分支」上）。
      # 真模型仍不下载：这一步跑的是 `helix` 的单测（守卫/参数解析，纯函数）。
      - name: local-rerank feature (cli)
        run: cargo test -p helix --features local-rerank
      # local-embed 必须真的可选（远程 embedding 场景会关掉它）
      - name: no-default-features
        run: cargo check -p helix-core --no-default-features

  # ------------------------------------------------------------ release 构建
  build-release:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 评测脚本（scripts/eval_*.sh）依赖 release 二进制，确保它编得出来
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v7
        with:
          name: helix-release
          path: target/release/helix
          retention-days: 7

  # ------------------------------------------------------------ CLI 冒烟
  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: helix-release
          path: target/release
      - run: chmod +x target/release/helix
      # demo 语料（30 篇）+ BM25：秒级、无需下载 ONNX 模型。
      # 只验证 CLI 端到端未被改坏，不做任何性能断言。
      - name: build + search round-trip
        run: |
          ./target/release/helix build --input data/corpus.jsonl --output /tmp/smoke.snapshot
          ./target/release/helix search --index /tmp/smoke.snapshot --mode bm25 "向量检索"
      - name: metadata filter
        run: |
          ./target/release/helix search --input data/corpus.jsonl --mode bm25 \
            --filter topic=vector "向量检索"
      # V2 Step 1 / S1-10：`--filter` 扩展出范围运算符后没有 CI 覆盖，补上。
      # demo 语料只有字符串字段 `topic`，没有数值字段，所以这里**不断言命中**——
      # 它真正覆盖的是「range 落在字段索引里不存在的字段」这条路径
      # （`doc_bits` 返回 None → 回落全扫），验证其不 panic 且退出码为 0。
      # 真正的选择度 / 延迟曲线由 scripts/eval_filter.sh 在本地跑（分钟级，不进 CI）。
      - name: metadata range filter
        run: |
          ./target/release/helix search --input data/corpus.jsonl --mode bm25 \
            --filter "score>=0" --filter "score<100" "向量检索"
          # `<=` / `>` 必须显式报错，不能被静默当成等值匹配
          if ./target/release/helix search --input data/corpus.jsonl --mode bm25 \
              --filter "score<=100" "向量检索" 2>/dev/null; then
            echo "错误：不支持的运算符 <= 应当被拒绝" >&2
            exit 1
          fi
      # V2 Step 6 / T7-11（PR 5）：增量追加路径（`--index`）的端到端覆盖。
      # 第二次追加同一份 demo 语料 ⇒ 全部命中 content_hash ⇒ 应为「新增 0 / 去重 N」；
      # 这同时钉住幂等（S6-T3 的 CLI 侧对应）与「追加后仍可检索」。
      # 第三条只给 `--index`（不带 `--input`）走「仅加载后重存」分支 —— 该分支用户可见
      # （往返诊断），此前零断言（PR #43 评审 P3-3）；它必须 exit 0，失败即 step 失败。
      # ⚠️ 不用 `| tee`：管道会吞掉 helix 的退出码，失败会被 tee 的成功掩盖。
      #
      # ⚠️ **覆盖边界（PR #43 评审 P3-3）**：这里验的是**纯 BM25** 追加（无 `--vectors`）。
      #    本 PR 的核心收益路径（向量快照追加：`embed_count` 打印、图 manifest 重发、
      #    `raw_vectors` 追加、`report_graph_status` 的 Loaded 分支、半向量守卫）都要**真模型**
      #    ⇒ 与「评测/性能不进 CI」同一纪律，**不进 CI**，由本地端到端实测 + 变异验证负责。
      #    别据此认为「向量追加路径已被 CI 守住」。
      - name: incremental build (--index)
        run: |
          ./target/release/helix build --input data/corpus.jsonl --output /tmp/incr.snapshot
          ./target/release/helix build --index /tmp/incr.snapshot \
            --input data/corpus.jsonl > /tmp/incr-second.log 2>&1
          cat /tmp/incr-second.log
          grep -qE "新增 0 / 去重跳过" /tmp/incr-second.log
          ./target/release/helix build --index /tmp/incr.snapshot
          ./target/release/helix search --index /tmp/incr.snapshot --mode bm25 "向量检索"
      # 半向量守卫（P1）必须在**构造 embedder 之前**拒绝：纯 BM25 快照 + `--vectors`。
      # 🔑 这一条**不需要模型** —— 预检只读快照指纹（`embedder_id` 为空）就判定，
      #    所以这条原先在 S6-T14 注释里承认「覆盖不到」的 CLI 接线，现在进了 CI
      #    （PR #43 第 2 轮评审 P3 的「第二份收益」）。
      # ⚠️ 依赖上一步留下的 /tmp/incr.snapshot（纯 BM25）。
      # ⚠️ 断言的是**预检**那句文案 ⇒ 若将来预检被移除，这里会变红（正是我们要的）。
      - name: 半向量守卫必须拒绝
        run: |
          if ./target/release/helix build --index /tmp/incr.snapshot --vectors \
               > /tmp/half.log 2>&1; then
            echo "错误：纯 BM25 快照 + --vectors 应当被拒绝" >&2
            exit 1
          fi
          cat /tmp/half.log
          grep -q "配置指纹显示它" /tmp/half.log
      # V2 Step 7 / S7-03：精排参数的四条守卫必须拒绝。
      # 🔑 与上一条同源收益：守卫**前移到加载任何资源之前**（快照 / 模型都不碰）
      #    ⇒ 本步**不下载 2.19GB 模型**，因此能进 CI。
      # ⚠️ 用默认构建（**未**编译 `local-rerank`）⇒ 第一条测的是「参数面互斥」：
      #    它刻意排在 feature 守卫**之前**（见 `bench.rs` 的 `run` 开头注释）——
      #    若有人把顺序调成「feature 守卫先」，这条会红，正是我们要的。
      - name: 精排参数守卫必须拒绝
        run: |
          B=./target/release/helix
          S=/tmp/incr.snapshot
          expect_reject() {
            local want="$1"; shift
            if "$B" bench --index "$S" --modes bm25 --no-latency "$@" \
                 > /tmp/rerank-guard.log 2>&1; then
              echo "错误：`bench $*` 应当被拒绝但成功了" >&2
              exit 1
            fi
            cat /tmp/rerank-guard.log
            # ⚠️ 必须 `-e "$want"`：期望串里有以 `-` 开头的（`--rerank-window`），
            #    直接 `grep -qF "$want"` 会被 grep 当**选项**解析 ⇒
            #    `grep: unrecognized option` 且退出码非 0 ⇒ 假失败（本地实跑抓到）。
            if ! grep -qF -e "$want" /tmp/rerank-guard.log; then
              echo "错误：错误信息里没有 \"$want\"" >&2
              exit 1
            fi
          }
          # ① `--runs > 1` 与精排互斥（图漂移会污染 A/B）
          expect_reject "互斥"            --runs 2 --rerank-window 20
          # ② max_length 是从属参数，单独给无意义
          expect_reject "--rerank-window" --rerank-max-length 1024
          # ③ 窗口 0：看起来像「关掉」，实际是「开了但空转」
          expect_reject "至少为 1"        --rerank-window 0
          # ④ 未编译 local-rerank：必须报错并提示重编（不得静默退回 NoOp）
          expect_reject "local-rerank"    --rerank-window 20
          echo "四条精排参数守卫全部按预期拒绝 ✅"
      # S6-T12（V2 Step 6 / T7-17）：`bench --threads 1`（默认）必须与不传该参数**行为完全一致**
      # —— 即**不新增任何输出阶段**。用 `--no-latency` 把输出限定在确定性部分（效果指标），
      # 只屏蔽「快照加载 耗时」这一行计时，其余**逐字比对**。
      # 🔑 走 BM25（**不需要模型**）⇒ 可进 CI。
      #
      # ⚠️ **每条断言都必须自证「真的跑到了」**（PR #44 评审 P2-3）：空文件之间的 `diff`
      #    同样 exit 0，只 grep 阶段表头也不等于产出了数据行。所以本步：
      #      ① 先断言比对对象**非空且含效果表**，再 diff；
      #      ② 用 `--json` 断言 `--threads 1` **没有** `threads` 键（比 grep stdout 更强）；
      #      ③ 反向自证落到**数据行**（`NFR-10` 判定行 + JSON `n_total` 精确值），
      #         而不是仅 `grep "并发吞吐"` 这个在任何行之前就打印的标题。
      # ⚠️ 依赖前面的 /tmp/incr.snapshot（纯 BM25，来自 data/corpus.jsonl）。
      - name: bench --threads 1 与默认一致
        run: |
          python3 -c "import json,pathlib;srcs=[json.loads(l)['source'] for l in pathlib.Path('data/corpus.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()];rows=[{'qid':'t%d'%i,'query':'检索 文档%d'%i,'type':'exact','relevance':[{'grade':3 if j==i else 0,'source':s} for j,s in enumerate(srcs[:8])]} for i in range(8)];pathlib.Path('/tmp/bq.jsonl').write_text('\n'.join(json.dumps(r,ensure_ascii=False) for r in rows)+'\n',encoding='utf-8')"
          B=./target/release/helix
          S=/tmp/incr.snapshot
          Q=/tmp/bq.jsonl
          # --- ① 默认 vs --threads 1：确定性输出逐字一致 --------------------------
          $B bench --index $S --queries $Q --modes bm25 --no-latency            > /tmp/b-default.out 2>&1
          $B bench --index $S --queries $Q --modes bm25 --no-latency --threads 1 > /tmp/b-t1.out    2>&1
          # 自证「真的跑到了」：效果表在、且有 bm25 数据行（否则下面的 diff 是空转通过）
          grep -q "效果评测" /tmp/b-default.out
          grep -qE "^bm25 " /tmp/b-default.out
          grep -v "快照加载 耗时" /tmp/b-default.out > /tmp/b-d.txt
          grep -v "快照加载 耗时" /tmp/b-t1.out    > /tmp/b-1.txt
          [ "$(wc -l < /tmp/b-d.txt)" -ge 5 ]
          [ "$(wc -l < /tmp/b-1.txt)" -ge 5 ]
          diff /tmp/b-d.txt /tmp/b-1.txt
          # --- ② `--threads 1` 不产生 B2：**必须不加 `--no-latency`** ------------
          #     ⚠️ 阶段 B2 与延迟同受 `--no-latency` 管辖 ⇒ 加了它这条断言必然通过（空转）。
          #     2026-09-13 **自查发现**并修正：此处原先带着 `--no-latency`，是假判据。
          $B bench --index $S --queries $Q --modes bm25 --threads 1 \
            --json /tmp/b-t1.json > /tmp/b-t1-nl.out 2>&1
          if grep -q "并发吞吐" /tmp/b-t1-nl.out; then
            echo "错误：--threads 1 不应出现并发阶段" >&2; exit 1
          fi
          python3 -c "import json,sys; d=json.load(open('/tmp/b-t1.json')); sys.exit(0 if 'threads' not in d else 1)"
          # --- ③ 反向自证：含 >1 档时必须产出**数据行**（不只是阶段标题）---------
          #     档位取 1,2,4 而非 1,2：只有同时测到 1 与 4 才会打印 NFR-10 判定行。
          $B bench --index $S --queries $Q --modes bm25 --threads 1,2,4 --reps 2 \
            --json /tmp/b-t124.json > /tmp/b-t124.out 2>&1
          grep -q "并发吞吐" /tmp/b-t124.out
          # ⚠️ 别用 `grep "NFR-10"`：阶段标题里就含 `NFR-10`（`== 并发吞吐（… / NFR-10 方案 A）==`），
          #    实测 `--threads 1,2`（无 t=4 ⇒ 不给判定）也会「通过」。必须用**固定串**钉判定行。
          grep -qE "^  [1-4] +[0-9]" /tmp/b-t124.out   # 表里真的有数据行
          grep -qF "QPS(4)/QPS(1)"   /tmp/b-t124.out   # 真的给出了 NFR-10 判定
          python3 -c "import json; d=json.load(open('/tmp/b-t124.json'))['threads']['bm25']; got=[d[str(t)]['n_total'] for t in (1,2,4)]; assert got==[16,32,64], got; print('threads n_total 校验通过:', got)"
      # `--input` 与 `--index` 都不给必须报错（clap 的 required_unless_present）。
      - name: build 参数缺失必须被拒绝
        run: |
          if ./target/release/helix build --output /tmp/should-not-exist.snapshot 2>/dev/null; then
            echo "错误：既无 --input 也无 --index 时应当报错" >&2
            exit 1
          fi
