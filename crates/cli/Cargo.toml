[package]
name        = "helix"
description = "HelixIndex 的命令行工具（建索引 / 检索 / 评测）"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[features]
default = []
charabia = ["helix-core/charabia"]  # T5-09 分词对照实验（--analyzer charabia）
# V2 Step 7 / S7-03：本地精排（`--rerank-window`）。
# ⚠️ **非默认**：模型 ≈2.19GB（`bge-reranker-v2-m3`）⇒ 不给这个 feature 就编不出精排，
# 传 `--rerank-window` 会**报错并提示重编**（不静默退回 NoOp，同 `--analyzer charabia`）。
local-rerank = ["helix-core/local-rerank"]

[dependencies]
# 显式写 version 是为了让 cargo-deny 的 wildcards 检查通过（纯 path 依赖会被判为 wildcard）
helix-core = { path = "../core", version = "0.1.0" }
anyhow.workspace = true
clap.workspace   = true
serde.workspace     = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
