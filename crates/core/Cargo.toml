[package]
name        = "index-core"
description = "面向 Agent 场景的通用检索引擎内核"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[features]
default      = ["local-embed"]
local-embed  = ["dep:fastembed"]
remote-embed = []            # P2 引入 dep:reqwest
positions    = []            # posting 存储位置信息
charabia     = ["dep:charabia"]  # T5-09 分词对照实验（feature 隔离）

[dependencies]
# 工程基础
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
rayon.workspace      = true
tracing.workspace    = true
smol_str.workspace   = true

# 文本处理
jieba-rs.workspace              = true
unicode-segmentation.workspace  = true
unicode-normalization.workspace = true

# 检索内核
bincode.workspace          = true
crc32fast.workspace        = true
moka.workspace             = true
xxhash-rust.workspace      = true

# 向量索引（P4 A/B 定案：hnsw_rs 原生增量 insert 胜出，instant-distance 已移除 D8）
hnsw_rs.workspace = true

# 可选：charabia 分词对照（T5-09；验证性依赖，不进默认特性）
charabia = { version = "0.10", default-features = false, features = ["chinese"], optional = true }

# 可选：本地 embedding（P2 启用）
fastembed = { workspace = true, optional = true }

[dev-dependencies]
# ADR-007：仅作为 BM25 正确性对照基线，不参与构建产物
tantivy  = "0.26"
criterion = "0.8"
proptest  = "1"
tempfile  = "3"
anyhow.workspace = true
clap.workspace = true

[[example]]
name = "embed_smoke"
required-features = ["local-embed"]

[[example]]
name = "search_basic"
required-features = ["local-embed"]
